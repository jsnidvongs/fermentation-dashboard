:root{--bg:#fff;--fg:#141a12;--g:#222F1D;--g2:#34462c;--cu:#8B5A2B;--muted:#586056;--line:#e0e3dd;--line2:#c6cbc2;--chip:#f3f4f1;--ok:#2f6b3a;--warn:#b45309;--bad:#c0281f;--accent:#222F1D;--accent-fg:#fff;--f:'Jost',system-ui,-apple-system,'Segoe UI',sans-serif;--sans:var(--f);--mono:var(--f);--slab:var(--f)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:400 16px/1.65 var(--f);background:#fff;color:var(--fg);padding-top:env(safe-area-inset-top,0)}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line2)}
.hrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:.7rem max(clamp(1rem,3vw,3.2rem),env(safe-area-inset-right)) .7rem max(clamp(1rem,3vw,3.2rem),env(safe-area-inset-left));gap:1rem}
.hrow .logo{height:46px;width:auto;justify-self:start}
.wordmark{text-align:center;font:300 1.5rem/1.1 var(--f);letter-spacing:.22em;text-transform:uppercase;white-space:nowrap}
.wordmark small{display:block;font:400 .62rem/1.6 var(--f);letter-spacing:.22em;color:var(--muted);margin-top:.2rem}
.hrow button{justify-self:end}
nav{display:flex;justify-content:center;gap:.2rem;border-top:1px solid var(--line);padding:0 1rem}
nav a{display:flex;align-items:center;padding:.7rem 1rem;color:var(--muted);text-decoration:none;font:400 .78rem/1.2 var(--f);letter-spacing:.16em;text-transform:uppercase;border-bottom:2px solid transparent;min-height:46px}
nav a svg{display:none;width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
nav a:hover{color:var(--fg)}
nav a.on{color:var(--fg);border-bottom-color:var(--g)}
main{max-width:none;margin:0;padding:2rem max(clamp(1rem,3vw,3.2rem),env(safe-area-inset-right)) calc(3rem + env(safe-area-inset-bottom,0)) max(clamp(1rem,3vw,3.2rem),env(safe-area-inset-left))}
.crumbs{font:400 .7rem/1.5 var(--f);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:0 0 1rem}
.crumbs a{color:inherit;text-decoration:none}.crumbs a:hover{color:var(--fg);text-decoration:underline}
h2{font:300 2.8rem/1.1 var(--f);margin:.3rem 0 .7rem;letter-spacing:0}
h3{font:400 .78rem/1.4 var(--f);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:2.8rem 0 .9rem;padding-top:1rem;border-top:1px solid var(--line2);display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
h3 button:first-of-type,h3 .btn:first-of-type{margin-left:auto}
.card h3,.tank h3,dialog h3{font:300 1.75rem/1.2 var(--f);letter-spacing:0;text-transform:none;color:var(--fg);margin:0 0 .35rem;padding:0;border:0;display:block}
.lead{font:300 1.2rem/1.6 var(--f);color:var(--muted);margin:.2rem 0 1.3rem;max-width:60ch}
a{color:var(--fg);text-underline-offset:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1.4rem}
.card{background:#fff;border:1px solid var(--line2);border-radius:0;padding:1.2rem}
.muted{color:var(--muted);font-size:.93rem}
.hint{font-size:.88rem;color:var(--muted);margin:.1rem 0 .7rem;line-height:1.45;max-width:64ch}
.tank{border-left:6px solid var(--ok)}.tank.warn{border-left-color:var(--warn)}.tank.bad{border-left-color:var(--bad)}
.tank h3 a{text-decoration:none}
.stat{font-weight:500;margin:.6rem 0;line-height:1.4}
.stat::before{content:'●';margin-right:.5rem;font-size:.75em}
.stat.ok{color:var(--ok)}.stat.warn{color:var(--warn)}.stat.bad{color:var(--bad)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin:1.1rem 0 1rem}
.tile{border-top:1px solid var(--fg);padding-top:.55rem}
.tile .tv{font:300 2rem/1.15 var(--f);font-variant-numeric:tabular-nums}
.tile .tl{font:400 .66rem/1.5 var(--f);letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-top:.3rem}
.tile .ts{font-size:.8rem;color:var(--muted);line-height:1.4;margin-top:.2rem}
.tile.bad{border-top-color:var(--bad)}.tile.bad .tv{color:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1.8rem 1.8rem;margin:1.6rem 0 .5rem}
.kpi{border-top:1px solid var(--fg);padding-top:.8rem}
.kv{font:300 2.6rem/1.1 var(--f);font-variant-numeric:tabular-nums}
.kl{font:400 .72rem/1.5 var(--f);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:.4rem}
.ks{font-size:.85rem;color:var(--muted);margin-top:.2rem}
.facts{border-top:1px solid var(--line2)}
.fr{display:grid;grid-template-columns:minmax(120px,40%) 1fr;gap:1rem;padding:.8rem 0;border-bottom:1px solid var(--line2);align-items:baseline}
.fk{font:400 .7rem/1.5 var(--f);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.fv{font:400 1rem/1.5 var(--f);word-break:break-word}
.dark{background:var(--g);color:#fff;padding:1.8rem 1.5rem;margin:.4rem 0}
.dark .facts,.dark .fr{border-color:rgba(255,255,255,.28)}.dark .fk{color:rgba(255,255,255,.72)}.dark .fv{color:#fff}
@media (min-width:900px){.facts.two{display:grid;grid-template-columns:1fr 1fr;column-gap:3.5rem}}
@media (min-width:1500px){.facts.two{grid-template-columns:1fr 1fr 1fr}}
.chip{display:inline-block;padding:.05rem .55rem;border-radius:0;background:var(--chip);font:500 .68rem/1.8 var(--f);letter-spacing:.1em;text-transform:uppercase;margin:.1rem .25rem .1rem 0}
.chip.bad{background:var(--bad);color:#fff}.chip.warn{background:var(--warn);color:#fff}.chip.ok{background:var(--ok);color:#fff}
.bad-t{color:var(--bad)}.warn-t{color:var(--warn)}
button,.btn{font:500 .78rem/1 var(--f);letter-spacing:.16em;text-transform:uppercase;min-height:46px;padding:.8rem 1.5rem;border-radius:0;border:1px solid var(--g);background:#fff;color:var(--g);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.4rem;text-decoration:none}
button:hover,.btn:hover{background:var(--chip)}
button.primary{background:var(--g);color:#fff}
button.primary:hover{background:var(--g2)}
button.small,.btn.small{min-height:36px;padding:.35rem .85rem;font:500 .85rem/1.2 var(--f);letter-spacing:.03em;text-transform:none;border-color:var(--line2);color:var(--fg)}
button.big{min-height:54px;padding:.9rem 2rem}
input,select,textarea{font:400 1rem var(--f);min-height:46px;padding:.55rem .7rem;border:1px solid var(--line2);border-radius:0;background:#fff;color:var(--fg);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--g);outline-offset:-1px}
label{display:block;font:400 .72rem/1.4 var(--f);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:1.05rem 0 .3rem}
.row{display:flex;gap:.8rem;flex-wrap:wrap;align-items:end}.row>*{flex:1 1 150px}.row>h2{flex:1 1 100%}
.tablewrap{overflow-x:auto;border-top:1px solid var(--fg);background:#fff}
table{border-collapse:collapse;width:100%;font:400 .95rem/1.45 var(--f)}
th,td{padding:.7rem .85rem;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:#fff;cursor:pointer;user-select:none;font:400 .68rem/1.4 var(--f);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line2)}
tr.grp td{background:var(--chip);font-weight:500}
.banner{padding:.7rem .9rem;margin-bottom:1rem;background:var(--chip);border:1px solid var(--line);font-size:.93rem}
.banner.err{background:var(--bad);color:#fff;border-color:var(--bad)}
.charts{display:grid;grid-template-columns:1fr;gap:0 2.2rem;align-items:start}
@media (min-width:1000px){.charts{grid-template-columns:1fr 1fr}}
@media (min-width:1500px){.charts.three{grid-template-columns:1fr 1fr 1fr}}
.cs{min-width:0}
.chart{width:100%;max-width:none;height:auto;display:block;background:#fff;border:0;border-top:1px solid var(--fg)}
.chart text{fill:#4a5148;font:400 12px var(--f);letter-spacing:.04em}.chart .gl{stroke:#e3e6e0}
dialog{max-height:92vh;overflow:auto;border:1px solid var(--g);border-radius:0;background:#fff;color:var(--fg);width:min(94vw,580px);padding:1.5rem}
dialog::backdrop{background:rgba(20,26,18,.5)}
.dt{display:flex;gap:.4rem}.dt>*{flex:1 1 0;min-width:0}
.bar{height:.6rem;background:var(--g);border-radius:0;min-width:2px}
.tag{display:inline-block;padding:.02rem .75rem;border-radius:999px;background:#fff;border:1px solid var(--line2);color:var(--fg);font:500 .86rem/1.7 var(--f);margin:.1rem .3rem .1rem 0;white-space:nowrap}
.legend span{display:inline-flex;align-items:center;gap:.5rem;margin:.3rem 1.1rem .2rem 0;font:400 .68rem/1.4 var(--f);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.legend i{width:1.4rem;height:2px;display:inline-block}
details.abar{margin-bottom:1.2rem;overflow:hidden;border:1px solid var(--line2);background:#fff}
details.abar>summary{list-style:none;cursor:pointer;padding:.9rem 1.1rem;font:500 1rem/1.45 var(--f);color:#fff}
details.abar>summary::-webkit-details-marker{display:none}
details.abar.critical>summary{background:var(--bad)}details.abar.warning>summary{background:var(--warn)}details.abar.info>summary{background:var(--g)}
.aitem{padding:.9rem 1.1rem;border-top:1px solid var(--line)}
.why{background:var(--chip);border-left:3px solid var(--g);padding:.55rem .8rem;margin:.55rem 0;font-size:.95rem}
.steps{padding-left:1.4rem}.steps li{margin:.5rem 0}
.help dt{font-weight:500;margin-top:1rem}.help dd{margin:.15rem 0 0 0;color:var(--muted)}
.ok-line{color:var(--ok);font-weight:500;border:1px solid var(--line2);padding:.65rem 1rem;margin-bottom:1.2rem}
.ph,.legend span.ph,th .ph,label .ph,h3 .ph,.kl .ph,.tl .ph,.fk .ph{text-transform:none!important;letter-spacing:inherit}
@media (max-width:720px){
  .hrow{padding:.55rem .8rem;gap:.5rem}
  .hrow .logo{height:38px}
  .wordmark{font-size:.82rem;letter-spacing:.14em}.wordmark small{display:none}
  nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:1px solid var(--line2);padding:0 0 env(safe-area-inset-bottom,0);justify-content:space-around;gap:0}
  nav a{flex:1;flex-direction:column;gap:.15rem;padding:.5rem .1rem .45rem;font-size:.56rem;letter-spacing:.1em;min-height:54px;justify-content:center;text-align:center;border-bottom:0;border-top:3px solid transparent}
  nav a svg{display:block}
  nav a.on{border-top-color:var(--g)}
  main{padding-top:1.2rem;padding-bottom:calc(6.5rem + env(safe-area-inset-bottom,0))}
  h2{font-size:2.2rem}
  .kpis{grid-template-columns:1fr 1fr;gap:1.4rem 1.1rem}.kv{font-size:2.1rem}
  .tile .tv{font-size:1.65rem}
}
</style>
</head>

<script>
"use strict";
/* ============ config + API ============ */
const LS = 'cd_ferm_cfg';
const cfg = JSON.parse(localStorage.getItem(LS) || '{}'); // { url, token, name }
const saveCfg = () => localStorage.setItem(LS, JSON.stringify(cfg));
const TZ = 'Asia/Bangkok';
const SERVER_VERSION = '2026-10-05.3'; // the Code.gs version this page expects
const NAV = [['today', 'Today'], ['all', 'Batches'], ['trends', 'Trends'], ['import', 'Checks'], ['help', 'Help'], ['settings', 'Settings']];
const ICON = { today: '<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/>', all: '<path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/>', trends: '<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/>', import: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/>', help: '<circle cx="12" cy="12" r="9"/><path d="M9.5 9.2a2.5 2.5 0 115 0c0 1.7-2.5 2-2.5 3.8M12 17h.01"/>', settings: '<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>' };

async function api(action, body) {
  if (!cfg.url || !cfg.token) throw new Error('Not connected. Open Settings and enter the web app URL and token.');
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 45000);
  let j;
  try {
    const res = await fetch(cfg.url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // simple request: no CORS preflight
      body: JSON.stringify(Object.assign({ token: cfg.token, action }, body || {})),
      redirect: 'follow', signal: ctl.signal
    });
    const text = await res.text();
    try { j = JSON.parse(text); }
    catch (pe) { const t = (/<title>([^<]*)<\/title>/i.exec(text) || [])[1]; throw new Error('The web app sent back a web page instead of data' + (t ? ' (page title: "' + t.trim().slice(0, 80) + '")' : '') + '. Usual causes: the deployment is not set to "Anyone", the URL is from an old deployment, or Apps Script needs to be authorised again.'); }
  } catch (e) {
    if (/web app sent back a web page/.test(e.message)) throw e;
    throw new Error(e.name === 'AbortError' ? 'The Sheet took too long to answer. Try Refresh.' : 'Could not reach the Sheet (' + e.message + '). Check the web app URL in Settings.');
  } finally { clearTimeout(timer); }
  if (!j.ok) throw new Error(j.error || 'Request failed');
  if (j.data === undefined) throw new Error('The server sent an empty reply to "' + action + '"' + (body && body.table ? ' (' + body.table + ')' : '') + '. Redeploy the Apps Script as a new version.');
  return j.data;
}

/* ============ colour tags: the same rules as the conditional formatting on the Batches tab of the 2026/27 Sheet ============ */
// Each rule is "text contains": the first match wins, case-insensitive, exactly as in Google Sheets. A value with no match stays white.
// Jamian (the spelling in the Lists tab) is given the same colour as Jamnian.
const TAG_RULES = {
  spirit: [['Blanc', '#B6D7A8'], ['Jamnian', '#DD7E6B'], ['Jamian', '#DD7E6B'], ['Thung Set', '#FFD966'], ['Mae Win', '#9FC5E8'], ['Test Batch', '#B4A7D6'], ['High Ester', '#6FA8DC']],
  farm: [['Mae Win', '#A4C2F4'], ['Jamnian', '#DD7E6B'], ['Jamian', '#DD7E6B'], ['Don Pao', '#6AA84F'], ['Thung Seti', '#FFD966'], ['Bad Kad', '#674EA7'], ['Rung Arung', '#46BDC6']],
  variety: [['Yak Kiew', '#93C47D'], ['50', '#FFD966']],
  yeast: [['RM', '#F6B26B'], ['Wild', '#6D9EEB']]
};
const tagCol = (kind, v) => { const x = (TAG_RULES[kind] || []).find(r => String(v).toLowerCase().indexOf(r[0].toLowerCase()) >= 0); return x ? [x[1], '#000000'] : null; };
const tagCss = (kind, v) => { const c = tagCol(kind, v); return c ? `background:${c[0]};color:${c[1]}` : ''; };
const tag = (kind, v) => (v === '' || v == null) ? '' : `<span class="tag" style="${tagCss(kind, v)}">${esc(v)}</span>`;
const TAG_KINDS = ['spirit', 'farm', 'variety', 'yeast'];

/* ============ plain-English field names and hints ============ */
const LBL = {
  batch_id: ['Batch number', 'For example 4.02'], season: ['Season', ''], spirit: ['Spirit', ''], farm: ['Farm', 'Where the cane came from'], variety: ['Cane variety', ''], yeast: ['Yeast', ''], vessel: ['Tank', 'The fermenter this batch is in'],
  status: ['Status', 'Planned, active (fermenting) or finished'], pair_id: ['Pair name', 'Two batches fermented together share a pair name, for example P1'], source_batch_id: ['Yeast taken from batch', 'Leave empty unless this batch was pitched from another batch'],
  repitch_generation: ['Re-pitch generation', '0 for fresh yeast, 1 for the first crop'], pill_id: ['Sensor (Pill)', 'Leave empty if no sensor is in this tank'],
  cut_time: ['Cane cut', 'Date and time (to the nearest 15 minutes)'], delivery_time: ['Cane delivered', ''], press_time: ['Crushed (pressed)', ''], pitch_time: ['Yeast added (pitched)', 'The fermentation clock starts here'], finish_time: ['Finished', 'When fermentation was called done'],
  juice_volume_l: ['Juice volume (litres)', ''], juice_sg: ['Juice sugar level (SG)', 'For example 1.080'], juice_ph: ['Juice acidity (pH)', ''], water_added_l: ['Water added (litres)', ''], og_after_dilution: ['Starting SG after adding water', 'Leave empty if no water was added'],
  yeast_grams: ['Yeast added (grams)', ''], ending_sg: ['Final sugar level (SG)', ''], ending_ph: ['Final acidity (pH)', ''], confirmed_dry: ['Confirmed dry', ''], notes: ['Notes', ''],
  delivery_date: ['Delivery date', ''], ferment_date: ['Fermentation start date', ''], finish_date_called: ['Date called finished', ''], delivery_weight_kg: ['Delivery weight (kg)', 'Shared by every batch in the same delivery'], price_per_kg: ['Price per kg', ''],
  approximate_weight: ['Cane weight (approx.)', ''], liquid_in_l: ['Juice in (litres)', ''], sg_juice: ['Juice sugar level (SG)', ''], ph_juice: ['Juice acidity (pH)', ''], adjusted_start_ph: ['pH after adjusting at the start', ''],
  delivery_weight_basis: ['Delivery weight source', ''], days_to_called_finish: ['Days to finish', ''], ph_day7_second_col: ['Second "Day 7" pH value', 'Time unknown']
};
const lab = k => LBL[k] ? LBL[k][0] : k.replace(/_/g, ' ');
const hintOf = k => LBL[k] && LBL[k][1] ? `<div class="hint">${esc(LBL[k][1])}</div>` : '';
const readLbl = k => k.replace(/^(sg|ph)_/, '').replace(/^day(\d)/, 'Day $1').replace(/^(\d+)h$/, '$1 hours');
const SETLBL = { ph_min: 'Lowest acceptable pH', ph_target: 'Target pH when adding buffer', ph_ceiling: 'Highest acceptable pH', ph_protect_hours: 'Hours to protect pH after the yeast goes in', ph_drop_alert_delta: 'pH fall that triggers an alert', ph_drop_alert_hours: 'Within how many hours (pH fall)', no_sg_fall_hours: 'Hours before checking that sugar level has fallen', sg_fall_min: 'Smallest SG fall that counts as fermenting', temp_max_c: 'Too-hot temperature (°C)', target_days_to_finish: 'Target days to finish', overdue_reading_hours_first_24h: 'Reading due every (hours), first 24 h', overdue_reading_hours_after: 'Reading due every (hours), after 24 h', pill_silent_minutes: 'Sensor silent for (minutes) before alert', pill_low_battery_pct: 'Sensor low battery level', sg_implausible_low: 'SG too low to be real', sg_implausible_high: 'SG too high to be real', alert_repeat_minutes: 'Hide an acknowledged alert for (minutes)' };
const settingName = k => SETLBL[k] || k.replace(/_/g, ' ');

/* "pH" must keep its lower-case p inside upper-case labels */
function fixPh(root) {
  if (!root) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => /pH/.test(n.nodeValue) && n.parentElement && !n.parentElement.closest('script,style,.ph,textarea,option,svg') ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT });
  const nodes = []; while (w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(n => { const parts = n.nodeValue.split('pH'), frag = document.createDocumentFragment(); parts.forEach((p, i) => { if (i) { const sp = document.createElement('span'); sp.className = 'ph'; sp.textContent = 'pH'; frag.appendChild(sp); } frag.appendChild(document.createTextNode(p)); }); n.parentNode.replaceChild(frag, n); });
}

/* ============ small helpers ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const isNum = v => v !== '' && v !== null && v !== undefined && isFinite(Number(v));
const f = (n, d) => isNum(n) ? Number(n).toFixed(d) : '–';
const hrs = (a, b) => (new Date(b) - new Date(a)) / 36e5;
const dtf = new Intl.DateTimeFormat('en-GB', { timeZone: TZ, day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
const fmtT = iso => iso ? dtf.format(new Date(iso)) : '–';
const fmtDur = h => { if (!isFinite(h)) return '–'; const d = Math.floor(h / 24); return (d ? d + 'd ' : '') + Math.floor(h % 24) + 'h'; };
const median = a => { const s = a.filter(isNum).map(Number).sort((x, y) => x - y); if (!s.length) return null; const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const mean = a => { const s = a.filter(isNum).map(Number); return s.length ? s.reduce((x, y) => x + y, 0) / s.length : null; };
const setting = (k, d) => { const v = S.settings[k]; return isNum(v) ? Number(v) : (v === undefined || v === '' ? d : v); };
const lastBy = (arr, key) => arr.filter(r => isNum(r[key])).sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp)).pop();

/* ============ state ============ */
const S = { batches: [], readings: [], interventions: [], telemetry: [], pills: [], alerts: [], settingsRows: [], settings: {}, lists: {}, season: [], status: null, loaded: false, error: null, sort: { key: 'batch_id', dir: 1 }, flt: { q: '', status: '', season: '', group: false }, tr: { season: '', yeast: '' } };

async function load() {
  try {
    S.error = null;
    let d;
    try { d = await api('bootstrap'); } // one request for everything
    catch (e) {
      if (!/Unknown action/.test(e.message)) throw e;
      const rd = (table, limit) => api('read', { table, limit }).then(r => r.rows); // older server: separate reads, one at a time
      const rows = {}; for (const t of ['Batches', 'Readings', 'Interventions', 'Telemetry', 'Pills', 'Alerts', 'Settings', 'Lists', 'Season 2025-26']) rows[t] = await rd(t, t === 'Telemetry' ? 20000 : undefined);
      rows['Edit Log'] = await rd('Edit Log').catch(() => []); rows.status = await api('status'); d = rows; S.oldServer = true;
    }
    const g = n => d[n] || [], lists = g('Lists');
    Object.assign(S, { batches: g('Batches'), readings: g('Readings'), interventions: g('Interventions'), telemetry: g('Telemetry'), pills: g('Pills'), alerts: g('Alerts'), season: g('Season 2025-26'), status: d.status, editLog: g('Edit Log'), settingsRows: g('Settings') });
    S.settings = {}; S.settingsRows.forEach(r => { S.settings[r.key] = r.value; });
    S.lists = {}; if (lists.length) Object.keys(lists[0]).forEach(k => { S.lists[k] = lists.map(r => r[k]).filter(v => v !== ''); });
    if (d.status && d.status.version) S.oldServer = d.status.version !== SERVER_VERSION;
    S.loaded = true;
  } catch (e) { S.error = e.message; }
  render();
}

/* ============ routing ============ */
function route() { const h = (location.hash || '#/today').slice(2).split('/'); return { view: h[0] || 'today', arg: h.slice(1).map(decodeURIComponent).join('/') }; }
function render() {
  const r = route();
  $('#nav').innerHTML = NAV.map(([k, l]) => `<a href="#/${k}" class="${r.view === k || (r.view === 'batch' && k === 'all') ? 'on' : ''}"><svg viewBox="0 0 24 24" aria-hidden="true">${ICON[k]}</svg><span>${l}</span></a>`).join('');
  const app = $('#app');
  let html = '';
  if (S.error) html += `<div class="banner err">${esc(S.error)}</div>`;
  if (!S.loaded && r.view !== 'settings' && r.view !== 'help') { app.innerHTML = html + (cfg.url ? '<p class="muted">Loading…</p>' : connectPrompt()); return; }
  if (S.oldServer) html += '<div class="banner err">The Apps Script is out of date, so loading is slow and some features will fail. Replace Code.gs and deploy a new version (Deploy, Manage deployments, pencil, New version).</div>';
  html += alertBar();
  html += raptBanner();
  app.innerHTML = html + ({ today: viewToday, batch: viewBatch, all: viewAll, trends: viewTrends, import: viewImport, help: viewHelp, settings: viewSettings }[r.view] || viewToday)(r.arg);
  fixPh(app);
  if (r.view === 'import') loadImport();
  if (r.view === 'settings') bindSettings();
  if (r.view === 'all') bindAll();
  const ab = document.querySelector('details.abar'); if (ab) { ab.open = !!S.barOpen; ab.ontoggle = () => { S.barOpen = ab.open; }; }
}
window.addEventListener('hashchange', render);
let lastVw = document.documentElement.clientWidth, resizeTimer;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { const w = document.documentElement.clientWidth; if (S.loaded && Math.abs(w - lastVw) > 20) { lastVw = w; render(); } }, 200); });
$('#refresh').onclick = load;
const connectPrompt = () => '<div class="card"><h2>Connect</h2><p>Enter the web app URL and token in <a href="#/settings">Settings</a>.</p></div>';

function raptBanner() {

function bkkParts(iso) { const p = {}; new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(new Date(iso)).forEach(x => { p[x.type] = x.value; }); return { d: `${p.year}-${p.month}-${p.day}`, t: `${p.hour}:${p.minute}` }; }

/* ============ alerts: worked out in the browser, shown as a bar ============ */
// Nothing is sent anywhere. Rules run on every load and refresh. Edit levels here.
const HOWTO = { ph_low: 'The batch is too acid. Buffer (KHCO₃) is what holds pH up. Re-measure after adding it.', ph_drop: 'pH is falling quickly. Measure again soon to see if it keeps falling.', no_sg_fall: 'The sugar level has not dropped, so the yeast may not have started. Check the yeast went in and the temperature.', temp_high: 'The tank is too hot. Check the cooling.', overdue: 'Measure pH and SG, then tap Log a reading.', day7: 'This batch has passed the 7-day target. Check how it is progressing and whether it can be called finished.', sg_implausible: 'That SG looks wrong. Measure it again.', pill_silent: 'The sensor has stopped reporting. Check its battery and WiFi.', pill_battery: 'Replace or charge the sensor soon.' };
const ALERT_LEVEL = { ph_low: 'critical', ph_drop: 'warning', no_sg_fall: 'warning', temp_high: 'critical', overdue: 'warning', day7: 'warning', pill_silent: 'warning', pill_battery: 'info', sg_implausible: 'warning', test: 'info' };
function computeAlerts() {
  const out = [], now = new Date();
  const add = (rule, b, msg, value, threshold, worse) => out.push({ rule, batch_id: b.batch_id, level: ALERT_LEVEL[rule], message: msg, value, threshold, worse });
  const phMin = setting('ph_min', 4), protH = setting('ph_protect_hours', 72), tMax = setting('temp_max_c', 34), dropD = setting('ph_drop_alert_delta', 0.5), dropH = setting('ph_drop_alert_hours', 6);
  const sgLo = setting('sg_implausible_low', 0.99), sgHi = setting('sg_implausible_high', 1.12), noSgH = setting('no_sg_fall_hours', 12), fallMin = setting('sg_fall_min', 0.002);
  S.batches.filter(b => b.status === 'active').forEach(b => {
    const id = b.batch_id, i = batchInfo(b), h = i.h, tag = `${id} (${b.vessel || 'no vessel'})`;
    const R = S.readings.filter(r => r.batch_id === id).sort((a, c) => new Date(a.timestamp) - new Date(c.timestamp)), T = tele(id);
    const phs = R.filter(r => isNum(r.ph)), lp = phs[phs.length - 1];
    if (lp && h !== null && h <= protH && Number(lp.ph) < phMin) add('ph_low', b, `${tag}: pH ${f(lp.ph, 2)} is below ${phMin} (first ${protH} h).`, Number(lp.ph), phMin, (c, a) => c < a - 0.05);
    if (lp && hrs(lp.timestamp, now) <= dropH) { const win = phs.filter(r => r !== lp && hrs(r.timestamp, lp.timestamp) <= dropH); if (win.length) { const drop = Math.max(...win.map(r => Number(r.ph))) - Number(lp.ph); if (drop > dropD) add('ph_drop', b, `${tag}: pH fell ${drop.toFixed(2)} within ${dropH} h.`, drop, dropD, (c, a) => c > a + 0.1); } }
    if (h !== null && h >= noSgH && i.sg && hrs(b.pitch_time, i.sgT) >= noSgH) {
      const start = [b.og_after_dilution, b.juice_sg].find(isNum) || (R.find(r => isNum(r.sg)) || {}).sg;
      if (isNum(start) && Number(start) - Number(i.sg) < fallMin) add('no_sg_fall', b, `${tag}: SG has not fallen (${f(start, 3)} to ${f(i.sg, 3)}) ${noSgH} h after pitch.`, Number(start) - Number(i.sg), fallMin);
    }
    const lt = T.length ? T[T.length - 1] : null, lm = i.tp;
    const temp = lt && (!lm || new Date(lt.timestamp) >= new Date(lm.timestamp)) ? Number(lt.temperature_c) : lm ? Number(lm.temperature_c) : null;
    if (temp !== null && isNum(temp) && temp > tMax) add('temp_high', b, `${tag}: temperature ${temp.toFixed(1)} °C is above ${tMax} °C.`, temp, tMax, (c, a) => c > a + 1);
    if (i.overdue) add('overdue', b, `${tag}: no reading for ${fmtDur(i.since)} (due every ${i.need} h).`, i.since, i.need);
    if (h !== null && h > setting('target_days_to_finish', 7) * 24) add('day7', b, `${tag}: day ${(h / 24).toFixed(1)}, past the ${setting('target_days_to_finish', 7)}-day target.`, h / 24, setting('target_days_to_finish', 7));
    [i.sg ? Number(i.sg) : null, ...(lt ? [lt.sgc] : [])].filter(v => v !== null && isNum(v)).forEach(v => { if (v < sgLo || v > sgHi) add('sg_implausible', b, `${tag}: SG ${v.toFixed(3)} looks wrong (outside ${sgLo} to ${sgHi}).`, v, v < sgLo ? sgLo : sgHi); });
    if (S.status && S.status.rapt_last_ok && b.pill_id) { // only once the RAPT poller has run
      const pt = S.telemetry.filter(t => t.pill_id === b.pill_id).sort((a, c) => new Date(a.timestamp) - new Date(c.timestamp)), last = pt[pt.length - 1];
      if (last && hrs(last.timestamp, now) * 60 > setting('pill_silent_minutes', 60)) add('pill_silent', b, `${tag}: Pill silent for ${Math.round(hrs(last.timestamp, now) * 60)} min.`, hrs(last.timestamp, now) * 60, setting('pill_silent_minutes', 60));
      if (last && isNum(last.battery) && Number(last.battery) < setting('pill_low_battery_pct', 20)) add('pill_battery', b, `${tag}: Pill battery ${last.battery}.`, Number(last.battery), setting('pill_low_battery_pct', 20));
    }
  });
  if (S.testAlert) out.push({ rule: 'test', batch_id: '—', level: 'info', message: 'Test alert. Acknowledging it records nothing.', value: 1, threshold: 0, test: true });
  return out;
}
function alertState() {
  const now = new Date(), rep = setting('alert_repeat_minutes', 60);
  return computeAlerts().map(a => {
    if (a.test) return Object.assign({ state: 'open' }, a);
    const acks = S.alerts.filter(r => r.rule === a.rule && String(r.batch_id) === String(a.batch_id) && r.acknowledged_at).sort((x, y) => new Date(y.acknowledged_at) - new Date(x.acknowledged_at));
    const k = acks[0]; if (!k) return Object.assign({ state: 'open' }, a);
    const snooze = isNum(k.snooze_minutes) ? Number(k.snooze_minutes) : rep, age = (now - new Date(k.acknowledged_at)) / 6e4;
    const worse = a.worse && isNum(k.value) && a.worse(Number(a.value), Number(k.value));
    return age < snooze && !worse ? Object.assign({ state: 'snoozed', by: k.acknowledged_by }, a) : Object.assign({ state: 'open' }, a);
  });
}
function alertBar() {
  if (!S.loaded) return '';
  const all = alertState(), open = all.filter(a => a.state === 'open'), sn = all.length - open.length;
  if (!open.length) return `<div class="ok-line">✓ No alerts. Everything is within its limits.${sn ? ' (' + sn + ' hidden for now)' : ''}</div>`;
  const rank = { critical: 3, warning: 2, info: 1 }, top = open.slice().sort((a, b) => rank[b.level] - rank[a.level])[0];
  window.__alerts = open;
  return `<details class="abar ${top.level}"><summary>${top.level === 'critical' ? '⚠ Needs action now' : '⚠ Needs a look'}: ${esc(top.message)}${open.length > 1 ? ' (+' + (open.length - 1) + ' more)' : ''}<br><span style="font-weight:400;font-size:.9rem">Tap here to see what to do${sn ? ' · ' + sn + ' hidden for now' : ''}</span></summary>${open.sort((a, b) => rank[b.level] - rank[a.level]).map((a, n) => `<div class="aitem"><span class="chip ${a.level === 'critical' ? 'bad' : a.level === 'warning' ? 'warn' : ''}">${a.level === 'critical' ? 'Act now' : a.level === 'warning' ? 'Check soon' : 'For your info'}</span> <b>${esc(a.message)}</b>${HOWTO[a.rule] ? `<div class="why"><b>What to do:</b> ${esc(HOWTO[a.rule])}</div>` : ''}<div class="row" style="margin-top:.4rem">${a.batch_id !== '—' ? `<a class="btn small" href="#/batch/${encodeURIComponent(a.batch_id)}">Open batch</a>` : ''}<button class="small" onclick="ackAlertIdx(${n},60)">I've seen this (hide for 1 hour)</button><button class="small" onclick="ackAlertIdx(${n},360)">Hide for 6 hours</button></div></div>`).join('')}</details>`;
}
async function ackAlertIdx(n, mins) {
  const a = window.__alerts[n]; if (!a) return;
  if (a.test) { S.testAlert = false; return render(); }
  try { await api('logAck', { ack: { rule: a.rule, batch_id: a.batch_id, level: a.level, message: a.message, value: a.value, threshold: a.threshold, snooze_minutes: mins, enteredBy: who() } }); await load(); } catch (e) { S.error = e.message; render(); }
}

/* ============ start ============ */
if (cfg.url && cfg.token) { render(); load(); } else { if (!location.hash || location.hash === '#/today') location.hash = '#/settings'; render(); }
setInterval(() => { if (document.visibilityState === 'visible' && S.loaded) load(); }, 120000);
</script>
