:root{--bg:#fff;--fg:#111827;--card:#fff;--muted:#6b7280;--line:#e5e7eb;--chip:#f3f4f6;--accent:#111827;--accent-fg:#fff;--warn:#b45309;--bad:#dc2626;--ok:#16a34a;--temp:#dc2626;--sg:#2563eb;--ph:#16a34a;--sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;--slab:'Zilla Slab',Georgia,serif}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 var(--sans);background:var(--bg);color:var(--fg);padding-top:env(safe-area-inset-top,0)}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:.55rem 1rem;display:flex;gap:.8rem;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.6rem;flex:1 1 auto}.brand img{height:34px;width:auto}
header h1{font:600 1.15rem/1.1 var(--slab);margin:0;letter-spacing:.01em}
header .sub{font:400 .62rem/1.2 var(--mono);color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
nav{display:flex;gap:.2rem;flex-wrap:wrap}
nav a{padding:.3rem .65rem;border-radius:6px;color:var(--muted);text-decoration:none;font:500 .72rem/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;border:1px solid transparent}
nav a.on{color:var(--fg);border-color:var(--fg)}
main{max-width:1100px;margin:0 auto;padding:1rem;padding-bottom:calc(2rem + env(safe-area-inset-bottom,0))}
h2{font:600 1.4rem/1.2 var(--slab);margin:.2rem 0 .8rem}h3{font:600 1.05rem/1.2 var(--slab);margin:1.1rem 0 .45rem}
a{color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:.8rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.85rem}
.card h3{margin:0 0 .15rem;font-size:1.15rem}
.muted{color:var(--muted);font-size:.8rem}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.2rem .9rem;margin:.6rem 0;font-size:.85rem}
.kv>span{font:400 .74rem/1.9 var(--mono);color:var(--muted);letter-spacing:.04em}
.kv b{font:500 .95rem/1.5 var(--mono)}
.chip{display:inline-block;padding:.05rem .5rem;border-radius:4px;background:var(--chip);font:500 .68rem/1.6 var(--mono);letter-spacing:.04em;margin:.1rem .2rem .1rem 0;text-transform:uppercase}
.chip.bad{background:var(--bad);color:#fff}.chip.warn{background:var(--warn);color:#fff}.chip.ok{background:var(--ok);color:#fff}
.bad-t{color:var(--bad)}.warn-t{color:var(--warn)}
button,.btn{font:500 .85rem var(--sans);padding:.45rem .8rem;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
button:hover,.btn:hover{border-color:var(--fg)}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button.small,.btn.small{padding:.2rem .55rem;font-size:.78rem}
input,select,textarea{font:400 .9rem var(--mono);padding:.4rem .5rem;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--fg);outline-offset:-1px}
label{display:block;font:400 .66rem/1.4 var(--mono);color:var(--muted);margin:.55rem 0 .15rem;letter-spacing:.1em;text-transform:uppercase}
.row>h2{flex:1 1 100%!important}.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:end}.row>*{flex:1 1 140px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--card)}
table{border-collapse:collapse;width:100%;font:400 .78rem/1.4 var(--mono)}
th,td{padding:.45rem .65rem;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:var(--chip);cursor:pointer;user-select:none;font-weight:500;color:var(--muted);letter-spacing:.04em;font-size:.72rem}
tr.grp td{background:var(--chip);font-weight:500}
.banner{padding:.55rem .8rem;border-radius:8px;margin-bottom:.8rem;background:var(--chip);font:400 .78rem var(--mono)}
.banner.err{background:var(--bad);color:#fff}
.chart{width:100%;height:auto;display:block;background:var(--card);border:1px solid var(--line);border-radius:8px}
.chart text{fill:var(--muted);font:400 10px var(--mono)}.chart .gl{stroke:var(--line)}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);width:min(94vw,520px);padding:1rem}
dialog::backdrop{background:rgba(17,24,39,.4)}
.bar{height:.55rem;background:var(--sg);border-radius:2px;min-width:2px}
.legend span{display:inline-flex;align-items:center;gap:.35rem;margin-right:.9rem;font:400 .7rem var(--mono);color:var(--muted)}
.legend i{width:.9rem;height:.25rem;display:inline-block;border-radius:2px}
details.abar{border-radius:8px;margin-bottom:.8rem;overflow:hidden;border:1px solid var(--line);background:var(--card)}
details.abar>summary{list-style:none;cursor:pointer;padding:.65rem .8rem;font:500 .85rem var(--sans);color:#fff}
details.abar>summary::-webkit-details-marker{display:none}
details.abar.critical>summary{background:var(--bad)}details.abar.warning>summary{background:var(--warn)}details.abar.info>summary{background:var(--accent)}
.aitem{padding:.55rem .8rem;border-top:1px solid var(--line)}
@media (max-width:640px){nav{order:3;width:100%}header{padding:.5rem .7rem}main{padding:.7rem}header .sub{display:none}}
</style>
</head>

<script>
"use strict";
/* ============ config + API ============ */
const LS = 'cd_ferm_cfg';
const cfg = JSON.parse(localStorage.getItem(LS) || '{}'); // { url, token, name }
const saveCfg = () => localStorage.setItem(LS, JSON.stringify(cfg));
const TZ = 'Asia/Bangkok';
const NAV = [['today', 'Today'], ['all', 'All batches'], ['trends', 'Trends'], ['import', 'Data quality'], ['settings', 'Settings']];

async function api(action, body) {
  if (!cfg.url || !cfg.token) throw new Error('Not connected. Open Settings and enter the web app URL and token.');
  const res = await fetch(cfg.url, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // simple request: no CORS preflight
    body: JSON.stringify(Object.assign({ token: cfg.token, action }, body || {})),
    redirect: 'follow'
  });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || 'Request failed');
  return j.data;
}

/* ============ small helpers ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const isNum = v => v !== '' && v !== null && v !== undefined && isFinite(Number(v));
const f = (n, d) => isNum(n) ? Number(n).toFixed(d) : '–';
const hrs = (a, b) => (new Date(b) - new Date(a)) / 36e5;
const dtf = new Intl.DateTimeFormat('en-GB', { timeZone: TZ, day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
const fmtT = iso => iso ? dtf.format(new Date(iso)) : '–';
const fmtDur = h => { if (!isFinite(h)) return '–'; const d = Math.floor(h / 24); return (d ? d + 'd ' : '') + Math.floor(h % 24) + 'h'; };
const median = a => { const s = a.filter(isNum).map(Number).sort((x, y) => x - y); if (!s.length) return null; const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const mean = a => { const s = a.filter(isNum).map(Number); return s.length ? s.reduce((x, y) => x + y, 0) / s.length : null; };
const setting = (k, d) => { const v = S.settings[k]; return isNum(v) ? Number(v) : (v === undefined || v === '' ? d : v); };

/* ============ state ============ */
const S = { batches: [], readings: [], interventions: [], telemetry: [], pills: [], alerts: [], settingsRows: [], settings: {}, lists: {}, season: [], status: null, loaded: false, error: null, sort: { key: 'batch_id', dir: 1 }, flt: { q: '', status: '', season: '', group: false }, tr: { season: '', yeast: '' } };

async function load() {
  try {
    S.error = null;
    const rd = (table, limit) => api('read', { table, limit }).then(r => r.rows);
    const [batches, readings, interventions, telemetry, pills, alerts, settings, lists, season, status] = await Promise.all([
      rd('Batches'), rd('Readings'), rd('Interventions'), rd('Telemetry', 20000), rd('Pills'), rd('Alerts'), rd('Settings'), rd('Lists'), rd('Season 2025-26'), api('status')
    ]);
    Object.assign(S, { batches, readings, interventions, telemetry, pills, alerts, season, status, settingsRows: settings });
    S.settings = {}; settings.forEach(r => { S.settings[r.key] = r.value; });
    S.lists = {}; if (lists.length) Object.keys(lists[0]).forEach(k => { S.lists[k] = lists.map(r => r[k]).filter(v => v !== ''); });
    S.loaded = true;
  } catch (e) { S.error = e.message; }

}

/* ============ routing ============ */

  const app = $('#app');

  if (!S.loaded && r.view !== 'settings') { app.innerHTML = html + (cfg.url ? '<p class="muted">Loading…</p>' : connectPrompt()); return; }
  html += alertBar();

  app.innerHTML = html + ({ today: viewToday, batch: viewBatch, all: viewAll, trends: viewTrends, import: viewImport, settings: viewSettings }[r.view] || viewToday)(r.arg);
  if (r.view === 'import') loadImport();

}

function raptBanner() {

/* ============ data derivations ============ */
const pillOffset = id => { const p = S.pills.find(x => x.pill_id === id); return p && isNum(p.calibration_offset_sg) ? Number(p.calibration_offset_sg) : 0; };
const tele = id => S.telemetry.filter(t => t.batch_id === id && isNum(t.sg)).map(t => Object.assign({}, t, { sgc: Number(t.sg) + pillOffset(t.pill_id) })).sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
function smooth(pts, n) { return pts.map((p, i) => { const w = pts.slice(Math.max(0, i - n + 1), i + 1); return [p[0], w.reduce((s, q) => s + q[1], 0) / w.length]; }); }

function batchInfo(b) {
  const id = b.batch_id, now = new Date();
  const R = S.readings.filter(r => r.batch_id === id), T = tele(id);
  const pitch = b.pitch_time ? new Date(b.pitch_time) : null;
  const h = pitch ? (now - pitch) / 36e5 : null;
  const lastSgM = lastBy(R, 'sg'), lastSgT = T.length ? T[T.length - 1] : null;
  let sg = null, sgT = null, sgSrc = '';
  if (lastSgM && (!lastSgT || new Date(lastSgM.timestamp) >= new Date(lastSgT.timestamp))) { sg = lastSgM.sg; sgT = lastSgM.timestamp; sgSrc = 'manual'; }
  else if (lastSgT) { sg = lastSgT.sgc; sgT = lastSgT.timestamp; sgSrc = 'Pill'; }
  const ph = lastBy(R, 'ph'), tp = lastBy(R, 'temperature_c');
  const lastAny = R.length ? R.map(r => r.timestamp).sort().pop() : null;
  const need = h !== null && h < 24 ? setting('overdue_reading_hours_first_24h', 6) : setting('overdue_reading_hours_after', 24);
  const since = lastAny ? hrs(lastAny, now) : (h !== null ? h : null);
  const overdue = b.status === 'active' && since !== null && since > need;
  let rate = null; // SG change per hour over the last ~6 h, from stored Pill readings (not gravityVelocity)
  if (T.length > 3) { const last = new Date(T[T.length - 1].timestamp); const win = T.filter(t => (last - new Date(t.timestamp)) <= 6 * 36e5); if (win.length > 2) { const a = win[0], z = win[win.length - 1]; const dh = hrs(a.timestamp, z.timestamp); if (dh > 0.5) rate = (z.sgc - a.sgc) / dh; } }
  return { h, sg, sgT, sgSrc, ph, tp, overdue, since, need, rate };
}

/* ============ charts (inline SVG, no libraries) ============ */
function ticks(a, b, n) { const r = b - a; if (!(r > 0)) return [a]; const raw = r / n, p = Math.pow(10, Math.floor(Math.log10(raw))), fr = raw / p, st = (fr < 1.5 ? 1 : fr < 3 ? 2 : fr < 7 ? 5 : 10) * p, o = []; for (let v = Math.ceil(a / st) * st; v <= b + 1e-9; v += st) o.push(+v.toFixed(6)); return o; }

    if (sr.line && pts.length > 1) s += `<path d="${pts.map((p, i) => (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ' ' + Y(p[1]).toFixed(1)).join('')}" fill="none" stroke="${sr.color}" stroke-width="${sr.w || 2}" opacity="${sr.op || 1}"/>`;
    if (sr.dots) pts.forEach(p => { s += `<circle cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="${sr.r || 3.5}" fill="${sr.color}"${sr.tip ? `><title>${esc(sr.tip(p))}</title></circle>` : '/>'}`; });
  });

}

  <div class="legend muted"><span><i style="background:#93c5fd"></i>Pill raw</span><span><i style="background:#2563eb"></i>Pill smoothed (5 pts)</span><span><i style="background:#111827"></i>Manual</span>${T.length ? '' : '<span>No Pill data yet</span>'}</div>`;

  <div class="legend muted"><span><i style="background:#16a34a;opacity:.4"></i>pH ${setting('ph_min', 4)}–${setting('ph_ceiling', 5)} band</span>${Object.keys(IV_COL).map(k => `<span><i style="background:${IV_COL[k]}"></i>${k}</span>`).join('')}</div>`;

}
function download(name, text) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv' })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); }
const csvCell = v => { let s = String(v == null ? '' : v); if (/^[=+\-@]/.test(s) && isNaN(Number(s))) s = "'" + s; return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
const toCsv = (heads, rows) => [heads, ...rows].map(r => r.map(csvCell).join(',')).join('\n');
function csvAll() { download('batches.csv', toCsv(ALLCOLS.map(c => c[1]), filteredRows().map(r => ALLCOLS.map(([k]) => r[k] == null ? '' : (k === 'days' && r.days == null && r.elapsed != null ? r.elapsed : r[k]))))); }
function csvReadings(id) { const R = S.readings.filter(r => r.batch_id === id); download('readings-' + id + '.csv', toCsv(['timestamp', 'ph', 'sg', 'temperature_c', 'entered_by', 'notes'], R.map(r => [r.timestamp, r.ph, r.sg, r.temperature_c, r.entered_by, r.notes]))); }

/* ============ VIEW: trends ============ */
function viewTrends() {
  const all = allRows().filter(r => r.days != null);
  const seasons = [...new Set(all.map(r => r.season))], yeasts = [...new Set(all.map(r => r.yeast).filter(Boolean))].sort();
  const rows = all.filter(r => (!S.tr.season || r.season === S.tr.season) && (!S.tr.yeast || r.yeast === S.tr.yeast));
  const cols = { '2025-26': '#9ca3af', '2026-27': '#2563eb' };
  const scatter = (label, key, xl, xs, fmt) => {
    const sr = Object.keys(cols).map(sn => ({ pts: rows.filter(r => r.season === sn && isNum(r[key])).map(r => [Number(r[key]), r.days, r]), dots: true, color: cols[sn], tip: p => `${p[2].batch_id}: ${p[1].toFixed(1)} d at ${p[0]}` }));
    const xv = sr.flatMap(s => s.pts.map(p => p[0])), yv = sr.flatMap(s => s.pts.map(p => p[1]));
    if (!xv.length) return `<h3>${esc(label)}</h3><p class="muted">No data for this selection.</p>`;
    const xa = Math.min(...xv), xb = Math.max(...xv), pad = (xb - xa) * .08 || 0.01;
    return `<h3>${esc(label)} <span class="muted">(${xv.length} batches)</span></h3>${chart({ label, x0: xa - pad, x1: xb + pad, y0: 0, y1: Math.max(10, ...yv) + 2, yd: 0, xl, xf: fmt || (v => v), series: sr, bands: [{ y0: 0, y1: setting('target_days_to_finish', 7), color: '#16a34a' }] })}`;
  };
  let h = `<h2>Trends</h2><p class="muted">Days to finish is the date the batch was called done, not a confirmed dry reading. Sample sizes are small, so treat patterns as hypotheses. Green band is the target.</p>
  <div class="row"><div><label>Season</label><select id="ts"><option value="">Both</option>${seasons.map(s => `<option>${s}</option>`).join('')}</select></div><div><label>Yeast</label><select id="ty"><option value="">All</option>${yeasts.map(s => `<option>${esc(s)}</option>`).join('')}</select></div></div>
  <div class="legend muted" style="margin-top:.5rem"><span><i style="background:#9ca3af"></i>2025-26</span><span><i style="background:#2563eb"></i>2026-27</span></div>`;
  const ogOf = r => isNum(r.og) ? Number(r.og) : null;
  rows.forEach(r => { r.ogn = ogOf(r); const dp = r.delivery && r.pitch ? hrs(r.delivery, r.pitch) / 24 : null; r.age = r.season === '2026-27' ? (r.cut && r.pitch ? hrs(r.cut, r.pitch) / 24 : null) : dp; });
  h += scatter('Days to finish against starting gravity', 'ogn', 'starting gravity (SG)', null, v => v.toFixed(3));
  h += scatter('Days to finish against cane age', 'age', 'days from cut to pitch (2026-27) or delivery to pitch (2025-26, cut time not recorded)', null, v => v.toFixed(1));
  const group = key => { const g = {}; rows.forEach(r => { const k = r[key] || '(blank)'; (g[k] = g[k] || []).push(r.days); }); const mx = Math.max(1, ...Object.values(g).map(a => median(a))); return table2(key, g, mx); };
  const table2 = (key, g, mx) => `<div class="tablewrap"><table><thead><tr><th>${esc(key)}</th><th>Batches</th><th>Median days</th><th></th><th>Mean</th><th>Range</th></tr></thead><tbody>${Object.keys(g).sort().map(k => { const a = g[k]; return `<tr><td>${esc(k)}</td><td>${a.length}</td><td>${f(median(a), 1)}</td><td style="width:30%"><div class="bar" style="width:${(median(a) / mx * 100).toFixed(0)}%"></div></td><td>${f(mean(a), 1)}</td><td>${f(Math.min(...a), 0)}–${f(Math.max(...a), 0)}</td></tr>`; }).join('')}</tbody></table></div>`;
  ['variety', 'farm', 'yeast'].forEach(k => { h += `<h3>By ${k}</h3>${group(k)}`; });
  setTimeout(() => { const a = $('#ts'), b = $('#ty'); if (a) { a.value = S.tr.season; a.onchange = e => { S.tr.season = e.target.value; render(); }; } if (b) { b.value = S.tr.yeast; b.onchange = e => { S.tr.yeast = e.target.value; render(); }; } }, 0);
  return h;
}

/* ============ VIEW: import + data quality ============ */
function viewImport() { return `<h2>Import and data quality</h2><p class="muted">The 2025-26 import record. Nothing was corrected silently. Per-batch flags are in the dq_flags column of the Season 2025-26 tab.</p><div id="imp"><p class="muted">Loading…</p></div>`; }
async function loadImport() {
  try {
    const g = (await api('grid', { table: 'Import Report' })).rows;
    const head = r => r[1] === 'Value' || r[1] === 'Batches';
    let body = '';
    g.slice(1).forEach(r => { if (r.every(c => c === '')) body += '<tr><td colspan="3" style="padding:.2rem"></td></tr>'; else if (head(r)) body += `<tr class="grp"><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`; else body += `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td style="white-space:normal">${esc(r[2])}</td></tr>`; });
    const flagged = S.season.filter(r => r.dq_flags);
    $('#imp').innerHTML = `<div class="tablewrap"><table><tbody>${body}</tbody></table></div><h3>Flags by batch (${flagged.length})</h3>${table(['Batch', 'Flags'], flagged.map(r => [r.batch_id, r.dq_flags]))}`;
    document.querySelectorAll('#imp td').forEach(td => td.style.whiteSpace = 'normal');
  } catch (e) { $('#imp').innerHTML = `<div class="banner err">${esc(e.message)}</div>`; }
}

/* ============ VIEW: settings ============ */
function viewSettings() {
  return `<h2>Settings</h2><div class="card"><h3>Connection</h3><p class="muted">Stored only in this browser. Never in the page code or the repository.</p>
  <label>Web app URL (ends in /exec)</label><input id="cu" value="${esc(cfg.url || '')}" autocomplete="off">
  <label>Token</label><input id="ct" type="password" value="${esc(cfg.token || '')}" autocomplete="off">
  <label>Your name (saved with entries)</label><input id="cn" value="${esc(cfg.name || '')}">
  <div class="row" style="margin-top:.7rem"><button class="primary" id="cs">Save and connect</button><button id="cc">Forget on this device</button></div><div id="cm" class="muted" style="margin-top:.5rem"></div></div>
  <div class="card" style="margin-top:.8rem"><h3>Alerts</h3><p class="muted">Alerts appear as a bar at the top of every page. Nothing is sent by email or message.</p><button onclick="S.testAlert=true;location.hash='#/today';render()">Show a test alert</button></div>
  ${S.loaded ? `<h3>Thresholds and targets</h3><p class="muted">Changes apply to everyone and are recorded in the note column with your name and the time.</p>${S.settingsRows.map(r => `<div class="card" style="margin-bottom:.5rem"><b>${esc(r.key)}</b><div class="muted">${esc(r.note)}</div><div class="row" style="margin-top:.3rem"><input data-sk="${esc(r.key)}" value="${esc(r.value)}"><button class="small" data-sb="${esc(r.key)}">Save</button></div></div>`).join('')}` : ''}`;
}
function bindSettings() {
  const cs = $('#cs'); if (!cs) return;
  cs.onclick = async () => { cfg.url = $('#cu').value.trim(); cfg.token = $('#ct').value.trim(); cfg.name = $('#cn').value.trim(); saveCfg(); $('#cm').textContent = 'Connecting…'; try { await api('ping'); $('#cm').textContent = 'Connected.'; await load(); location.hash = '#/today'; } catch (e) { $('#cm').textContent = 'Failed: ' + e.message; } };
  $('#cc').onclick = () => { localStorage.removeItem(LS); Object.keys(cfg).forEach(k => delete cfg[k]); S.loaded = false; render(); };
  document.querySelectorAll('[data-sb]').forEach(btn => btn.onclick = async () => { const k = btn.dataset.sb, v = document.querySelector(`[data-sk="${k}"]`).value; try { await api('updateSetting', { key: k, value: v, enteredBy: who() }); btn.textContent = 'Saved'; await load(); } catch (e) { alert(e.message); } });
}

/* ============ forms ============ */
const who = () => { if (!cfg.name) { const n = prompt('Your name (saved with each entry):'); if (n) { cfg.name = n.trim(); saveCfg(); } } if (!cfg.name) throw new Error('A name is needed to save entries.'); return cfg.name; };
const nowLocal = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); };
const toIso = v => v ? new Date(v).toISOString() : '';
const opt = (arr, sel) => `<option value=""></option>` + (arr || []).map(v => `<option ${v === sel ? 'selected' : ''}>${esc(v)}</option>`).join('');
function dlg(html, onsave) {
  const d = $('#dlg'); d.innerHTML = `<form method="dialog" id="df">${html}<div id="de" class="bad-t" style="margin-top:.5rem"></div><div class="row" style="margin-top:.8rem"><button type="button" id="dx">Cancel</button><button class="primary" id="ds" type="submit">Save</button></div></form>`;
  d.showModal(); $('#dx').onclick = () => d.close();
  $('#df').onsubmit = async e => { e.preventDefault(); const btn = $('#ds'); btn.disabled = true; try { await onsave(); d.close(); await load(); } catch (err) { $('#de').textContent = err.message; btn.disabled = false; } };
}
const val = id => $('#' + id).value;
function openReadingForm(bid) {
  dlg(`<h3>Reading for ${esc(bid)}</h3><label>Time</label><input id="f_t" type="datetime-local" value="${nowLocal()}" required>
  <div class="row"><div><label>pH</label><input id="f_ph" type="number" step="0.01" inputmode="decimal"></div><div><label>SG</label><input id="f_sg" type="number" step="0.001" inputmode="decimal"></div><div><label>Temp °C</label><input id="f_tp" type="number" step="0.1" inputmode="decimal"></div></div><label>Notes</label><input id="f_n">`,
    () => api('addReading', { row: { batch_id: bid, timestamp: toIso(val('f_t')), ph: val('f_ph'), sg: val('f_sg'), temperature_c: val('f_tp'), notes: val('f_n'), entered_by: who() } }));
}
function openIvForm(bid) {
  dlg(`<h3>Intervention for ${esc(bid)}</h3><label>Time</label><input id="f_t" type="datetime-local" value="${nowLocal()}" required>
  <label>Type</label><select id="f_ty" required>${opt(S.lists.intervention_type)}</select><label>Product</label><input id="f_p"><div class="row"><div><label>Amount</label><input id="f_a" type="number" step="any"></div><div><label>Unit</label><input id="f_u" placeholder="g, mL, L"></div></div><label>Notes</label><input id="f_n">
  <p class="muted">Log what was actually added, not what the calculator recommended.</p>`,
    () => api('addIntervention', { row: { batch_id: bid, timestamp: toIso(val('f_t')), type: val('f_ty'), product: val('f_p'), amount: val('f_a'), unit: val('f_u'), notes: val('f_n'), entered_by: who() } }));
}
function openBatchForm(id) {
  const b = id ? (S.batches.find(x => String(x.batch_id) === id) || {}) : {};
  const loc = iso => { if (!iso) return ''; const d = new Date(iso); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); };
  const L = S.lists, pills = S.pills.map(p => p.pill_id);
  const sel = (k, arr) => `<div><label>${k}</label><select id="b_${k}">${opt(arr, b[k])}</select></div>`;
  const inp = (k, type, step) => `<div><label>${k}</label><input id="b_${k}" type="${type || 'text'}" ${step ? 'step="' + step + '"' : ''} value="${esc(type === 'datetime-local' ? loc(b[k]) : b[k])}"></div>`;
  dlg(`<h3>${id ? 'Edit ' + esc(id) : 'New batch'}</h3><div class="row">${id ? `<div><label>batch_id</label><input id="b_batch_id" value="${esc(id)}" readonly></div>` : inp('batch_id')}${inp('season')}</div>
  <div class="row">${sel('spirit', L.spirit)}${sel('farm', L.farm)}${sel('variety', L.variety)}</div><div class="row">${sel('yeast', L.yeast)}${sel('vessel', L.vessel)}${sel('status', L.status)}</div>
  <div class="row">${inp('pair_id')}${inp('source_batch_id')}${inp('repitch_generation', 'number', '1')}${sel('pill_id', pills)}</div>
  <div class="row">${inp('cut_time', 'datetime-local')}${inp('delivery_time', 'datetime-local')}${inp('press_time', 'datetime-local')}${inp('pitch_time', 'datetime-local')}</div>
  <div class="row">${inp('juice_volume_l', 'number', 'any')}${inp('juice_sg', 'number', '0.001')}${inp('juice_ph', 'number', '0.01')}${inp('water_added_l', 'number', 'any')}${inp('og_after_dilution', 'number', '0.001')}${inp('yeast_grams', 'number', 'any')}</div><label>notes</label><input id="b_notes" value="${esc(b.notes)}">`,
    () => { const o = {}; ['batch_id', 'season', 'spirit', 'farm', 'variety', 'yeast', 'vessel', 'status', 'pair_id', 'source_batch_id', 'repitch_generation', 'pill_id', 'juice_volume_l', 'juice_sg', 'juice_ph', 'water_added_l', 'og_after_dilution', 'yeast_grams', 'notes'].forEach(k => { o[k] = val('b_' + k); }); ['cut_time', 'delivery_time', 'press_time', 'pitch_time'].forEach(k => { o[k] = toIso(val('b_' + k)); }); if (!o.season) o.season = '2026-27'; return api('saveBatch', { batch: o, enteredBy: who() }); });
}

/* ============ alerts: worked out in the browser, shown as a bar ============ */
// Nothing is sent anywhere. Rules run on every load and refresh. Edit levels here.
const ALERT_LEVEL = { ph_low: 'critical', ph_drop: 'warning', no_sg_fall: 'warning', temp_high: 'critical', overdue: 'warning', day7: 'warning', pill_silent: 'warning', pill_battery: 'info', sg_implausible: 'warning', test: 'info' };
function computeAlerts() {
  const out = [], now = new Date();
  const add = (rule, b, msg, value, threshold, worse) => out.push({ rule, batch_id: b.batch_id, level: ALERT_LEVEL[rule], message: msg, value, threshold, worse });
  const phMin = setting('ph_min', 4), protH = setting('ph_protect_hours', 72), tMax = setting('temp_max_c', 34), dropD = setting('ph_drop_alert_delta', 0.5), dropH = setting('ph_drop_alert_hours', 6);
  const sgLo = setting('sg_implausible_low', 0.99), sgHi = setting('sg_implausible_high', 1.12), noSgH = setting('no_sg_fall_hours', 12), fallMin = setting('sg_fall_min', 0.002);
  S.batches.filter(b => b.status === 'active').forEach(b => {
    const id = b.batch_id, i = batchInfo(b), h = i.h, tag = `${id} (${b.vessel || 'no vessel'})`;
    const R = S.readings.filter(r => r.batch_id === id).sort((a, c) => new Date(a.timestamp) - new Date(c.timestamp)), T = tele(id);
    const phs = R.filter(r => isNum(r.ph)), lp = phs[phs.length - 1];
    if (lp && h !== null && h <= protH && Number(lp.ph) < phMin) add('ph_low', b, `${tag}: pH ${f(lp.ph, 2)} is below ${phMin} (first ${protH} h).`, Number(lp.ph), phMin, (c, a) => c < a - 0.05);
    if (lp && hrs(lp.timestamp, now) <= dropH) { const win = phs.filter(r => r !== lp && hrs(r.timestamp, lp.timestamp) <= dropH); if (win.length) { const drop = Math.max(...win.map(r => Number(r.ph))) - Number(lp.ph); if (drop > dropD) add('ph_drop', b, `${tag}: pH fell ${drop.toFixed(2)} within ${dropH} h.`, drop, dropD, (c, a) => c > a + 0.1); } }
    if (h !== null && h >= noSgH && i.sg && hrs(b.pitch_time, i.sgT) >= noSgH) {
      const start = [b.og_after_dilution, b.juice_sg].find(isNum) || (R.find(r => isNum(r.sg)) || {}).sg;
      if (isNum(start) && Number(start) - Number(i.sg) < fallMin) add('no_sg_fall', b, `${tag}: SG has not fallen (${f(start, 3)} to ${f(i.sg, 3)}) ${noSgH} h after pitch.`, Number(start) - Number(i.sg), fallMin);
    }
    const lt = T.length ? T[T.length - 1] : null, lm = i.tp;
    const temp = lt && (!lm || new Date(lt.timestamp) >= new Date(lm.timestamp)) ? Number(lt.temperature_c) : lm ? Number(lm.temperature_c) : null;
    if (temp !== null && isNum(temp) && temp > tMax) add('temp_high', b, `${tag}: temperature ${temp.toFixed(1)} °C is above ${tMax} °C.`, temp, tMax, (c, a) => c > a + 1);
    if (i.overdue) add('overdue', b, `${tag}: no reading for ${fmtDur(i.since)} (due every ${i.need} h).`, i.since, i.need);
    if (h !== null && h > setting('target_days_to_finish', 7) * 24) add('day7', b, `${tag}: day ${(h / 24).toFixed(1)}, past the ${setting('target_days_to_finish', 7)}-day target.`, h / 24, setting('target_days_to_finish', 7));
    [i.sg ? Number(i.sg) : null, ...(lt ? [lt.sgc] : [])].filter(v => v !== null && isNum(v)).forEach(v => { if (v < sgLo || v > sgHi) add('sg_implausible', b, `${tag}: SG ${v.toFixed(3)} looks wrong (outside ${sgLo} to ${sgHi}).`, v, v < sgLo ? sgLo : sgHi); });
    if (S.status && S.status.rapt_last_ok && b.pill_id) { // only once the RAPT poller has run
      const pt = S.telemetry.filter(t => t.pill_id === b.pill_id).sort((a, c) => new Date(a.timestamp) - new Date(c.timestamp)), last = pt[pt.length - 1];
      if (last && hrs(last.timestamp, now) * 60 > setting('pill_silent_minutes', 60)) add('pill_silent', b, `${tag}: Pill silent for ${Math.round(hrs(last.timestamp, now) * 60)} min.`, hrs(last.timestamp, now) * 60, setting('pill_silent_minutes', 60));
      if (last && isNum(last.battery) && Number(last.battery) < setting('pill_low_battery_pct', 20)) add('pill_battery', b, `${tag}: Pill battery ${last.battery}.`, Number(last.battery), setting('pill_low_battery_pct', 20));
    }
  });
  if (S.testAlert) out.push({ rule: 'test', batch_id: '—', level: 'info', message: 'Test alert. Acknowledging it records nothing.', value: 1, threshold: 0, test: true });
  return out;
}
function alertState() {
  const now = new Date(), rep = setting('alert_repeat_minutes', 60);
  return computeAlerts().map(a => {
    if (a.test) return Object.assign({ state: 'open' }, a);
    const acks = S.alerts.filter(r => r.rule === a.rule && String(r.batch_id) === String(a.batch_id) && r.acknowledged_at).sort((x, y) => new Date(y.acknowledged_at) - new Date(x.acknowledged_at));
    const k = acks[0]; if (!k) return Object.assign({ state: 'open' }, a);
    const snooze = isNum(k.snooze_minutes) ? Number(k.snooze_minutes) : rep, age = (now - new Date(k.acknowledged_at)) / 6e4;
    const worse = a.worse && isNum(k.value) && a.worse(Number(a.value), Number(k.value));
    return age < snooze && !worse ? Object.assign({ state: 'snoozed', by: k.acknowledged_by }, a) : Object.assign({ state: 'open' }, a);
  });
}
function alertBar() {
  if (!S.loaded) return '';
  const all = alertState(), open = all.filter(a => a.state === 'open'), sn = all.length - open.length;
  if (!open.length) return `<div class="banner muted">No open alerts.${sn ? ' ' + sn + ' snoozed.' : ''}</div>`;
  const rank = { critical: 3, warning: 2, info: 1 }, top = open.slice().sort((a, b) => rank[b.level] - rank[a.level])[0];
  window.__alerts = open;
  return `<details class="abar ${top.level}"><summary>${open.length} open alert${open.length > 1 ? 's' : ''}: ${esc(top.message)}${sn ? ' · ' + sn + ' snoozed' : ''}</summary>${open.sort((a, b) => rank[b.level] - rank[a.level]).map((a, n) => `<div class="aitem"><span class="chip ${a.level === 'critical' ? 'bad' : a.level === 'warning' ? 'warn' : ''}">${esc(a.level)}</span> ${esc(a.message)} ${a.batch_id !== '—' ? `<a href="#/batch/${encodeURIComponent(a.batch_id)}">Open</a>` : ''}<div style="margin-top:.3rem"><button class="small" onclick="ackAlertIdx(${n},60)">Acknowledge 1 h</button> <button class="small" onclick="ackAlertIdx(${n},360)">Snooze 6 h</button></div></div>`).join('')}</details>`;
}
async function ackAlertIdx(n, mins) {
  const a = window.__alerts[n]; if (!a) return;
  if (a.test) { S.testAlert = false; return render(); }
  try { await api('logAck', { ack: { rule: a.rule, batch_id: a.batch_id, level: a.level, message: a.message, value: a.value, threshold: a.threshold, snooze_minutes: mins, enteredBy: who() } }); await load(); } catch (e) { S.error = e.message; render(); }
}

/* ============ start ============ */
if (cfg.url && cfg.token) load(); else { if (!location.hash || location.hash === '#/today') location.hash = '#/settings'; render(); }
setInterval(() => { if (document.visibilityState === 'visible' && S.loaded) load(); }, 120000);
</script>
